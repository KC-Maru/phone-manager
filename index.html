<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰 회선 관리자 (구글 동기화 & 모바일 지원)</title>
    
    <!-- SheetJS CDN (엑셀 처리) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Firebase SDK (v9+ Compatibility Module) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --success-color: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: white;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .btn-auth {
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-google {
            background-color: #4285f4;
            color: white;
        }

        .btn-logout {
            background-color: #64748b;
            color: white;
        }

        .action-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .btn-excel {
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #16a34a;
            color: white;
            cursor: pointer;
        }

        .btn-outline {
            background-color: white;
            color: var(--text-color);
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .line-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .line-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            position: relative;
        }

        .line-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
            padding-right: 24px;
        }

        .telecom-badge {
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
        }
        .SKT { background-color: #ea580c; }
        .KT { background-color: #0284c7; }
        .LGU { background-color: #db2777; }
        .알뜰폰 { background-color: #16a34a; }

        .phone-num {
            font-weight: 700;
            font-size: 1rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .info-label { color: #64748b; }
        .info-value { font-weight: 600; }

        .status-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-ok { background: #dcfce7; color: #15803d; }
        .status-wait { background: #fef3c7; color: #b45309; }

        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .memo-box {
            background-color: #f1f5f9;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #475569;
            margin-top: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>📱 회선 관리 매니저</h1>
            <div style="font-size:0.8rem; color:#64748b; margin-top:2px;">
                총 회선: <span id="total-count" style="font-weight:bold; color:var(--primary-color);">0</span>개
            </div>
        </div>
        <div class="user-section">
            <div id="userInfo" class="user-info" style="display: none;">
                <img id="userAvatar" class="user-avatar" src="" alt="user">
                <span id="userName"></span>
                <button class="btn-auth btn-logout" onclick="googleLogout()">로그아웃</button>
            </div>
            <button id="btnLogin" class="btn-auth btn-google" onclick="googleLogin()">
                🔍 구글 계정으로 로그인
            </button>
        </div>
    </header>

    <div class="action-bar">
        <button class="btn-excel" onclick="exportToExcel()">📊 엑셀 저장 (.xlsx)</button>
        <button class="btn-excel btn-outline" onclick="document.getElementById('excelFileInput').click()">📂 엑셀 불러오기</button>
        <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="importFromExcel(event)">
    </div>

    <div class="container">
        <!-- 회선 입력 폼 -->
        <div class="card">
            <h2 style="font-size: 1rem; margin-bottom: 12px;">신규 회선 추가</h2>
            <form id="lineForm">
                <div class="form-group">
                    <label for="telecom">통신사</label>
                    <select id="telecom" required>
                        <option value="SKT">SKT</option>
                        <option value="KT">KT</option>
                        <option value="LGU">LGU+</option>
                        <option value="알뜰폰">알뜰폰</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="phoneNumber">애칭 / 번호</label>
                    <input type="text" id="phoneNumber" placeholder="예: 메인폰 / 010-1234-5678" required>
                </div>
                <div class="form-group">
                    <label for="openDate">개통일</label>
                    <input type="date" id="openDate" required>
                </div>
                <div class="form-group">
                    <label for="minCallDays">의무 통화 유지기간 (일)</label>
                    <input type="number" id="minCallDays" value="93">
                </div>
                <div class="form-group">
                    <label for="mandatoryMonths">의무 유지기간 (M+개월)</label>
                    <input type="number" id="mandatoryMonths" value="6">
                </div>
                <div class="form-group">
                    <label for="memo">메모</label>
                    <textarea id="memo" rows="3" placeholder="요금제 조건, 부가서비스 해지일 등"></textarea>
                </div>
                <button type="submit" class="btn-submit">회선 저장하기</button>
            </form>
        </div>

        <!-- 회선 카드 목록 -->
        <div>
            <div id="lineList" class="line-grid"></div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. Firebase 설정 (자신의 Firebase 프로젝트 설정값으로 교체하세요)
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyBgxbF_lNsNOg46LdIUQVEUQEeFNEn6CR8",
            authDomain: "my-phone-manager.firebaseapp.com",
            projectId: "my-phone-manager",
            storageBucket: "my-phone-manager.firebasestorage.app",
            messagingSenderId: "473844294167",
            appId: "1:473844294167:web:aac430aed05f1b2ccdf252"
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let lines = [];

        document.getElementById('openDate').valueAsDate = new Date();

        // -------------------------------------------------------------
        // 2. 인증 (구글 로그인)
        // -------------------------------------------------------------
        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => {
                alert('로그인 오류: ' + error.message);
            });
        }

        function googleLogout() {
            auth.signOut().then(() => {
                alert('로그아웃 되었습니다.');
            });
        }

        // 로그인 상태 감지
        auth.onAuthStateChanged(user => {
            currentUser = user;
            const btnLogin = document.getElementById('btnLogin');
            const userInfo = document.getElementById('userInfo');

            if (user) {
                btnLogin.style.display = 'none';
                userInfo.style.display = 'flex';
                document.getElementById('userName').textContent = user.displayName;
                document.getElementById('userAvatar').src = user.photoURL || 'https://via.placeholder.com/32';

                // 구글 클라우드 데이터 수신
                loadCloudData();
            } else {
                btnLogin.style.display = 'inline-flex';
                userInfo.style.display = 'none';

                // 비로그인 시 로컬스토리지 사용
                lines = JSON.parse(localStorage.getItem('myPhoneLines')) || [];
                renderLines();
            }
        });

        // -------------------------------------------------------------
        // 3. 데이터 저장 및 조회 (Firestore + LocalStorage)
        // -------------------------------------------------------------
        function loadCloudData() {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('lines').get().then(snapshot => {
                lines = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderLines();
            }).catch(err => {
                console.error("데이터 로드 실패:", err);
            });
        }

        function saveLineData(lineObj) {
            if (currentUser) {
                // 구글 계정이 연동되어 있으면 클라우드에 저장
                db.collection('users').doc(currentUser.uid).collection('lines').doc(String(lineObj.id)).set(lineObj)
                  .then(() => loadCloudData());
            } else {
                // 비로그인 상태일 때는 브라우저 로컬 저장소에 저장
                lines.push(lineObj);
                localStorage.setItem('myPhoneLines', JSON.stringify(lines));
                renderLines();
            }
        }

        function deleteLine(id) {
            if (!confirm('이 회선 정보를 삭제하시겠습니까?')) return;

            if (currentUser) {
                db.collection('users').doc(currentUser.uid).collection('lines').doc(String(id)).delete()
                  .then(() => loadCloudData());
            } else {
                lines = lines.filter(line => line.id !== id);
                localStorage.setItem('myPhoneLines', JSON.stringify(lines));
                renderLines();
            }
        }

        // -------------------------------------------------------------
        // 4. 날짜 및 UI 계산 렌더링
        // -------------------------------------------------------------
        function addDays(dateStr, days) {
            const date = new Date(dateStr);
            date.setDate(date.getDate() + parseInt(days));
            return date;
        }

        function getMPlusDate(dateStr, months) {
            const date = new Date(dateStr);
            return new Date(date.getFullYear(), date.getMonth() + parseInt(months) + 1, 0);
        }

        function formatDate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getDDay(targetDateStr) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const target = new Date(targetDateStr);
            target.setHours(0,0,0,0);
            const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays > 0) return `D-${diffDays}`;
            if (diffDays === 0) return `D-Day`;
            return `해제완료 (+${Math.abs(diffDays)}일)`;
        }

        document.getElementById('lineForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newLine = {
                id: Date.now(),
                telecom: document.getElementById('telecom').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                openDate: document.getElementById('openDate').value,
                minCallDays: document.getElementById('minCallDays').value,
                mandatoryMonths: document.getElementById('mandatoryMonths').value,
                memo: document.getElementById('memo').value
            };
            saveLineData(newLine);
            this.reset();
            document.getElementById('openDate').valueAsDate = new Date();
        });

        function renderLines() {
            const lineList = document.getElementById('lineList');
            document.getElementById('total-count').textContent = lines.length;

            if (lines.length === 0) {
                lineList.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8;">등록된 회선이 없습니다.</div>';
                return;
            }

            lineList.innerHTML = lines.map(line => {
                const callUnlockDate = formatDate(addDays(line.openDate, line.minCallDays));
                const mPlusUnlockDate = formatDate(getMPlusDate(line.openDate, line.mandatoryMonths));

                const callDDay = getDDay(callUnlockDate);
                const mPlusDDay = getDDay(mPlusUnlockDate);

                return `
                    <div class="line-card">
                        <button class="btn-delete" onclick="deleteLine(${line.id})">&times;</button>
                        <div class="line-header">
                            <span class="phone-num">${line.phoneNumber}</span>
                            <span class="telecom-badge ${line.telecom}">${line.telecom}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">개통일:</span>
                            <span class="info-value">${line.openDate}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">의무통화 (+${line.minCallDays}일):</span>
                            <span class="info-value">
                                ${callUnlockDate} 
                                <span class="status-tag ${callDDay.includes('완료') ? 'status-ok' : 'status-wait'}">${callDDay}</span>
                            </span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">유지기간 (M+${line.mandatoryMonths}):</span>
                            <span class="info-value">
                                ${mPlusUnlockDate} 
                                <span class="status-tag ${mPlusDDay.includes('완료') ? 'status-ok' : 'status-wait'}">${mPlusDDay}</span>
                            </span>
                        </div>
                        ${line.memo ? `<div class="memo-box">${line.memo}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        // -------------------------------------------------------------
        // 5. 엑셀 저장 & 불러오기
        // -------------------------------------------------------------
        function exportToExcel() {
            if (lines.length === 0) return alert('내보낼 데이터가 없습니다.');

            const exportData = lines.map(line => ({
                '통신사': line.telecom,
                '회선명/번호': line.phoneNumber,
                '개통일': line.openDate,
                '의무통화일수': line.minCallDays,
                '의무유지개월(M+)': line.mandatoryMonths,
                '메모': line.memo || ''
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "회선목록");
            XLSX.writeFile(workbook, `회선관리_${formatDate(new Date())}.xlsx`);
        }

        function importFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

                json.forEach((row, index) => {
                    saveLineData({
                        id: Date.now() + index,
                        telecom: row['통신사'] || 'SKT',
                        phoneNumber: row['회선명/번호'] || '회선' + (index + 1),
                        openDate: row['개통일'] ? formatDate(new Date(row['개통일'])) : formatDate(new Date()),
                        minCallDays: row['의무통화일수'] || 93,
                        mandatoryMonths: row['의무유지개월(M+)'] || 6,
                        memo: row['메모'] || ''
                    });
                });
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
